<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo by Soya</title>
    <style>
        * { margin:0; padding:0; }
        html, body { height:100%; overflow:hidden; background:#fafafa; }
        
        .loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.4s;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #eee;
            border-top-color: #2ea44f;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 15px;
        }
        .download-btn{
            width: 100%; height: 35px;
            border: 0 solid;
            margin-bottom: 15px;
            background-color: #171717;
            text-decoration: none;
            color: #fefefe;
            font-size:20px;
            text-align:center;
        }
        .download-btn :hover {
             background-color: #373737;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .pdf-container { width:100%; height:100vh; }
        embed { width:100%; height:100%; border:none; }
    </style>
</head>
<body>
 <button type="button" id="downloadLink" class="download-btn" >Download</button>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>Loading...</div>
    </div>

    <div class="pdf-container">
        <embed id="pdfEmbed" 
               src="soya.pdf" 
               type="application/pdf">
    </div>
   
    
    <script>
        const loading = document.getElementById('loading');
        const embed = document.getElementById('pdfEmbed');

        embed.onload = () => {
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 400);
        };

        setTimeout(() => {
            if (loading.style.display !== 'none') loading.style.display = 'none';
        }, 10000);
        
function downloadFile() {
    const link = document.createElement('a');
    link.href = 'soya.pdf';     // 文件路径
    link.download = 'portfolio_by_soya.pdf'; // 下载后的文件名
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

    </script>
</body>
</html>
